<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hedef.</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hedef.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
/* Layout: dark arcade-desk — one centred phone column for menus, a two-pane board + receipt rail for play on wide screens. */
:root{
  --bg:#12101d; --surface:#1c192d; --tile:#2c2648; --tile-shade:#141120; --tile-dim:#1c1830;
  --ink:#f4f1ff; --muted:#a59dc9; --faint:#5f5784; --line:#2b2641; --dot:#25213a;
  --lime:#c8ff4d; --lime-shade:#7a9f25; --lime-ink:#c8ff4d;
  --pink:#ff5d8b; --pink-shade:#a8325a; --pink-ink:#ff6f97;
  --amber:#ffc24d; --amber-shade:#9a6b14; --amber-ink:#ffc24d;
  --violet:#8e7cff;
  --paper:#f3f1ff; --paper-ink:#16131f; --paper-muted:#8a83a8; --paper-line:#cdc6e3;
  --on-accent:#121019; --scrim:rgba(8,6,16,.72);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root.t-day, :root.t-sys[data-theme="light"]{
  --bg:#f2effa; --surface:#ffffff; --tile:#ffffff; --tile-shade:#cdc6e6; --tile-dim:#e7e2f4;
  --ink:#1b1730; --muted:#676087; --faint:#b0a8cf; --line:#e2ddf0; --dot:#dcd6ee;
  --lime-shade:#8db62e; --lime-ink:#4c7600; --pink-ink:#d2335f; --amber-ink:#a06400;
  --paper:#ffffff; --scrim:rgba(40,32,70,.45); color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root.t-sys:not([data-theme="dark"]){
    --bg:#f2effa; --surface:#ffffff; --tile:#ffffff; --tile-shade:#cdc6e6; --tile-dim:#e7e2f4;
    --ink:#1b1730; --muted:#676087; --faint:#b0a8cf; --line:#e2ddf0; --dot:#dcd6ee;
    --lime-shade:#8db62e; --lime-ink:#4c7600; --pink-ink:#d2335f; --amber-ink:#a06400;
    --paper:#ffffff; --scrim:rgba(40,32,70,.45); color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(var(--dot) 1.2px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ios body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ios input,.ios textarea{-webkit-user-select:text;user-select:text}

/* ---------- shared ---------- */
.col{width:100%;max-width:460px;margin:0 auto;padding:28px 20px 32px;display:flex;flex-direction:column;gap:18px;flex:1}
.logo{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.9;font-size:30px;font-variation-settings:"opsz" 96}
.logo i{font-style:normal;color:var(--lime-ink)}
.logo.xl{font-size:clamp(72px,22vw,104px)}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-size:19px;line-height:1.4;margin:0;text-wrap:pretty}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.03em;text-wrap:balance;font-variation-settings:"opsz" 96}
.b3{position:relative;border-radius:22px;font-weight:700;transition:transform .08s,box-shadow .08s;box-shadow:0 6px 0 var(--sh,var(--tile-shade))}
.b3:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh,var(--tile-shade))}
.b-lime{background:var(--lime);color:var(--on-accent);--sh:var(--lime-shade)}
.b-pink{background:var(--pink);color:var(--on-accent);--sh:var(--pink-shade)}
.b-amber{background:var(--amber);color:var(--on-accent);--sh:var(--amber-shade)}
.b-paper{background:var(--paper);color:var(--paper-ink);--sh:#7d74a3}
.b-tile{background:var(--tile);color:var(--ink)}
.big{min-height:64px;padding:16px 22px;font-size:20px;width:100%}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--tile);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toprow h1{font-size:34px}
.card{background:var(--surface);border-radius:22px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.stat b{font-family:var(--display);font-size:clamp(20px,6vw,28px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-lime{color:var(--lime-ink)} .c-pink{color:var(--pink-ink)} .c-amber{color:var(--amber-ink)} .c-muted{color:var(--muted)}
.spacer{flex:1}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:80;max-width:calc(100% - 32px);text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}

/* ---------- login ---------- */
.login{position:relative;overflow:hidden}
.floaters{position:absolute;right:-44px;top:14px;width:180px;height:320px;pointer-events:none}
.login .lead{max-width:calc(100% - 64px);font-size:16px}
.fl{position:absolute;display:grid;place-items:center;font-family:var(--display);font-weight:800;box-shadow:0 8px 0 var(--sh)}
.fl1{right:30px;top:0;width:100px;height:100px;border-radius:26px;background:var(--tile);--sh:var(--tile-shade);font-size:40px;transform:rotate(-8deg)}
.fl2{right:-6px;top:112px;width:72px;height:72px;border-radius:50%;background:var(--pink);--sh:var(--pink-shade);color:var(--on-accent);font-size:32px}
.fl3{right:-28px;top:196px;width:104px;height:104px;border-radius:26px;background:var(--amber);--sh:var(--amber-shade);color:var(--on-accent);font-size:44px;transform:rotate(9deg)}
.login .col{padding-top:120px;position:relative}
.login .col > .b3{width:100%;max-width:320px;align-self:center;min-height:54px;font-size:17px;border-radius:18px}
.login .col > .authbtn{padding:8px 16px 8px 10px;gap:14px}
.login .col > .authbtn .ic{width:38px;height:38px;border-radius:10px}
.login .col > .authbtn .ic svg{width:20px;height:20px}
.login .or,.login .col > .eyebrow{width:100%;max-width:320px;align-self:center}
.authbtn{display:flex;align-items:center;gap:18px;text-align:left}
.authbtn .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.authbtn .ic svg{width:24px;height:24px}
.authbtn .ic{background:none!important;color:var(--on-accent)}
.authbtn{justify-content:center;gap:10px!important}
.authbtn .ic{width:auto!important;height:auto!important}
.authbtn .ic svg{width:22px!important;height:22px!important}
.or{display:flex;align-items:center;gap:16px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.legal{color:var(--faint);text-align:center;font-size:15px;line-height:1.5;margin:0}
.legal a{color:var(--lime-ink);font-weight:600}

/* ---------- home ---------- */
.home-head{display:flex;justify-content:space-between;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;border:3px solid var(--lime);background:var(--tile);display:grid;place-items:center;font-weight:800;font-size:18px}
.avatar.sm{width:52px;height:52px;font-size:16px}
.home-head .avatar{width:44px;height:44px;font-size:14px;border-width:2.5px}
.hello small{color:var(--muted);font-size:16px}
.hello h1{font-size:clamp(28px,8vw,36px);line-height:1.05;margin-top:4px}
.home .statrow{gap:10px}
.home .stat{padding:12px 14px;border-radius:16px}
.home .stat small{font-size:13px;margin-bottom:2px}
.home .stat b{font-size:clamp(18px,5.4vw,22px)}
.playcard{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 18px 22px;text-align:left;border-radius:22px;gap:12px;--sh:var(--lime-shade);box-shadow:0 4px 0 var(--sh)}
.playcard h2{font-size:26px;font-weight:800}
.playcard p{margin:2px 0 0;font-weight:500;font-size:14px}
.playbtn{width:74px;height:74px;border-radius:50%;background:var(--on-accent);color:var(--lime);display:grid;place-items:center;flex:none}
.playcard .playbtn{width:48px;height:48px}
.playcard .playbtn svg{width:20px;height:20px}
.dailycard{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;text-align:left;border-radius:22px;gap:12px;box-shadow:0 4px 0 var(--amber-shade)}
.dailycard h3{font-size:18px;font-weight:800;letter-spacing:-.02em}
.dailycard p{margin:2px 0 0;font-weight:500;font-size:14px}
.dailycard .dt{font-family:var(--mono);font-weight:800;font-size:15px;white-space:nowrap}
.menu{background:var(--surface);border-radius:20px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;font-weight:600;font-size:16px;text-align:left}
.menu button + button{border-top:1px solid var(--line)}
.menu button:hover{background:color-mix(in srgb,var(--tile) 50%,transparent)}
.menu svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu .chev{margin-left:auto;color:var(--faint);font-family:var(--mono)}
.home.col{gap:14px}

@media (max-width:380px){
  .lvl{padding:16px}
  .lvl p{font-size:13px}
}
/* ---------- setup ---------- */
.mode{display:flex;align-items:center;gap:18px;padding:20px 24px;text-align:left;width:100%}
.mode .radio{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--on-accent);flex:none;display:grid;place-items:center}
.mode .radio::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--on-accent);opacity:0}
.mode.on .radio::after{opacity:1}
.mode.off .radio{border-color:var(--tile-shade)}
.mode h3{font-size:24px;font-weight:800;letter-spacing:-.01em}
.mode p{margin:2px 0 0;font-size:16px;font-weight:500}
.mode.off p{color:var(--muted)}
.mode .rt{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lvl{padding:18px 20px;text-align:left;border-radius:20px;min-height:100px;display:flex;flex-direction:column;gap:6px}
.lvl.on{box-shadow:0 0 0 4px var(--ink) inset,0 6px 0 var(--pink-shade)}
.lvl .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.lvl p{margin:0;font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.3;color:var(--muted)}
.lvl.on p{color:var(--on-accent)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dots i.f{background:var(--lime)}
.lvl.on .dots i{background:color-mix(in srgb,var(--on-accent) 25%,transparent)}
.lvl.on .dots i.f{background:var(--on-accent)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.seg3 button{height:68px;font-size:26px;font-weight:800;border-radius:18px}
.seg3 button.on{box-shadow:0 0 0 4px var(--ink) inset,0 6px 0 var(--pink-shade)}
.bestline{display:flex;justify-content:space-between;color:var(--muted);font-size:17px}
.bestline b{color:var(--ink)}

/* ---------- game ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100%;flex:1;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));gap:14px;max-width:1400px;margin:0 auto;width:100%}
.ghead{display:flex;align-items:center;gap:12px}
.ghead .logo{font-size:28px}
.pill{background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.pill em{font-style:normal;color:var(--pink-ink)}
.gmeta{margin-left:auto;display:flex;gap:18px;color:var(--muted);font-size:17px;white-space:nowrap}
.gmeta b{color:var(--ink);font-size:20px;font-weight:800}
.gtools{display:none;gap:10px}
.ghead .dk{display:none}
.rhead .backb{display:none}
@media (max-width:919px){.game .ghead .logo{display:none}.game .ghead .iconbtn{width:44px;height:44px}}
@media (max-width:919px){.ghead{gap:8px}.ghead .logo{font-size:24px}.gmeta{gap:10px;font-size:15px}.gmeta b{font-size:17px}.pill{padding:6px 10px}}
.gmain{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.ring{position:relative;width:min(66vw,310px,32vh);aspect-ratio:1;max-width:100%}
.ring > svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm svg{width:18px;height:18px;flex:none}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ring .ctr small{font-family:var(--mono);font-weight:700;letter-spacing:.32em;color:var(--muted);font-size:14px;padding-left:.32em}
.ring .ctr .tgt{font-family:var(--display);font-weight:800;font-size:clamp(64px,min(21vw,11vh),120px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring .ctr .tm{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--lime-ink);display:flex;gap:6px;align-items:center;justify-content:center}
.ring .ctr .tm.warn{color:var(--amber-ink)} .ring .ctr .tm.crit{color:var(--pink-ink)}
.live{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:12px 18px;width:100%;max-width:420px;justify-content:center;flex-wrap:wrap}
.live .lv{min-width:84px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;padding:0 14px}
.live .lv.a{background:var(--amber);color:var(--on-accent)}
.live .lv.slot{border:2.5px dashed var(--faint);color:var(--muted);font-family:var(--body);font-weight:500;font-size:16px}
.live .lv,.live .lop{flex:none}
.live .lop{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--pink);color:var(--on-accent)}
.live .lop.empty{background:transparent;border:2.5px dashed var(--faint);color:var(--faint)}
.live .fark{color:var(--muted);font-size:18px;white-space:nowrap}
@media (max-width:919px){
  .live{flex-wrap:nowrap;gap:10px;padding:10px 12px}
  .live .lv{min-width:64px;height:50px;font-size:24px;padding:0 12px}
  .live .lv.slot{font-size:14px;padding:0 10px}
  .live .lop{width:40px;height:40px;font-size:20px}
  .live .fark{font-size:15px}.live .fark b{font-size:22px}
  .live .eq{display:none}
}
.live .fark b{color:var(--amber-ink);font-size:26px;font-weight:800}
.chips{display:flex;gap:10px;width:100%;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;min-width:calc(50% - 5px);scroll-snap-align:end}
.chip{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{font-style:normal;color:var(--paper-muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;padding-bottom:6px}
.tiles.many{grid-template-columns:repeat(5,1fr);gap:10px}
.tiles.lots{grid-template-columns:repeat(6,1fr);gap:8px}
.tiles.many .tile{font-size:clamp(20px,5.6vw,30px);border-radius:16px}
.tile{position:relative;aspect-ratio:1.25;border-radius:20px;background:var(--tile);box-shadow:0 7px 0 var(--tile-shade);font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:-.02em;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;font-variant-numeric:tabular-nums;animation:tilein .22s ease-out}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--tile-shade)}
.tile.der{color:var(--amber-ink)}
.tile.sel{background:var(--amber);color:var(--on-accent);box-shadow:0 0 0 4px var(--ink),0 7px 0 4px var(--amber-shade)}
.tile{display:flex!important;flex-direction:column;align-items:center;justify-content:center}
.tile .tv{line-height:1}
.tile .f{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile.sel .f{color:color-mix(in srgb,var(--on-accent) 70%,transparent)}
.tile.used{background:var(--tile-dim);color:var(--faint);box-shadow:none;cursor:default;animation:none}
.tile .k{position:absolute;left:10px;top:6px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);display:none}
.tile.sel .k{color:var(--on-accent)}
@keyframes tilein{from{transform:scale(.85);opacity:.4}}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;margin-top:auto}
.op{height:64px;border-radius:40px;font-size:30px;font-weight:800;display:grid;place-items:center}
.op.on{box-shadow:0 0 0 4px var(--ink) inset,0 6px 0 var(--pink-shade)}
.gside{display:flex;flex-direction:column;gap:14px;min-width:0}
.receipt{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:8px 8px 0 0;padding:20px 24px 18px;margin-bottom:10px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 10px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/14px 10px repeat-x}
.receipt .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.receipt h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.receipt .rh span{font-family:var(--mono);font-size:14px;color:var(--paper-muted);font-weight:600;letter-spacing:.06em}
.rrow{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-weight:700;font-size:18px;padding:11px 0;border-bottom:1.5px dashed var(--paper-line)}
.rrow i{font-style:normal;color:var(--paper-muted);margin-right:10px}
.rrow.pend{color:var(--paper-muted)}
.rrow b{font-weight:800}
.rempty{font-family:var(--mono);color:var(--paper-muted);font-size:15px;padding:10px 0 4px;line-height:1.5}
.hintbox{border:2px dashed var(--faint);border-radius:18px;padding:16px 20px;line-height:1.45}
.hintbox .hh{display:flex;justify-content:space-between;margin-bottom:6px}
.hintbox .hh b{color:var(--lime-ink)}
.hintbox .hh span{font-family:var(--mono);color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acts button{height:58px;border-radius:16px;font-size:17px}
.acts .hintb{color:var(--lime-ink)}
.acts button:disabled{opacity:.45;cursor:not-allowed}
.finish{height:66px;font-size:20px;width:100%}
.kbd{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:center;line-height:1.6;margin:0}
.mbar{display:grid;grid-template-columns:repeat(3,56px) 1fr;gap:10px}
.mbar .ib{height:58px;border-radius:16px;display:grid;place-items:center}

// A solution that keeps as much of the player's own path as possible, plus a one-line note.
function pathSolution(cur, steps) {
  const ORD = ["", "ilk", "ikinci", "üçüncü", "dördüncü", "beşinci"];
  for (let j = steps.length; j >= 0; j--) {
    const pool = cur.nums.slice(); let ok = true;
    for (const st of steps.slice(0, j)) {
      for (const v of [st.a, st.b]) { const i = pool.indexOf(v); if (i < 0) { ok = false; break; } pool.splice(i, 1); }
      if (!ok) break; pool.push(st.r);
    }
    if (!ok) continue;
    const rest = solve(pool, cur.target, cur.nums.length > 7 ? 60000 : 200000);
    if (!rest) continue;
    const kept = steps.slice(0, j).map(x => ({ a: x.a, op: x.op, b: x.b, r: x.r }));
    let note = "";
    if (!rest.length) note = `${cur.target} zaten elindeydi. Onu seçip bitirebilirdin.`;
    else if (j > 0) note = `Senin yolun ${ORD[j] || j + "."} adıma kadar aynıydı. ${rest[0].a} ile ${acc(rest[0].b)} birleştirmek hedefi tutturuyordu.`;
    else note = `Bu çözüm ${rest[0].a} ile ${acc(rest[0].b)} birleştirerek başlıyor.`;
    return { steps: kept.concat(rest), note };
  }
  return { steps: solve(cur.nums, cur.target) || cur.solution, note: "" };
}

/* ================= confetti ================= */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c); confettiEl = c;
  const x = c.getContext("2d"), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; x.scale(dpr, dpr);
  const cols = ["#c8ff4d", "#ff5d8b", "#ffc24d", "#8e7cff", "#f4f1ff"];
  const P = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .7, vx: (Math.random() - .5) * 1.6, vy: 1.6 + Math.random() * 2.6, r: Math.random() * 6.3, vr: (Math.random() - .5) * .16, w: 8 + Math.random() * 12, h: 6 + Math.random() * 5, c: cols[Math.random() * 5 | 0], dot: Math.random() < .35 }));
  const t0 = performance.now();
  (function f(t) {
    if (confettiEl !== c) return;
    x.clearRect(0, 0, W, H);
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; if (p.dot) { x.beginPath(); x.arc(0, 0, p.h / 2, 0, 7); x.fill(); } else { x.beginPath(); x.roundRect ? x.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2) : x.rect(-p.w / 2, -p.h / 2, p.w, p.h); x.fill(); } x.restore(); }
    if (t - t0 < 5000) requestAnimationFrame(f); else { c.remove(); if (confettiEl === c) confettiEl = null; }
  })(t0);
}

  confirmreset: () => { S.sheet = { type: "reset" }; render(); },
  doreset: () => { S.history = []; S.best = 0; S.session = null; S.daily = {}; ["history", "best", "session", "daily"].forEach(k => store.del(k)); G = null; S.back = null; toast("İlerleme sıfırlandı."); go("home"); },
  period: v => { S.period = v; render(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  if (el.disabled) return;
  ac();
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset.v, el, e);
});
document.addEventListener("input", e => {
  if (!e.target.classList.contains("cnt-range")) return;
  const n = Number(e.target.value), pct = (n - COUNT_MIN) / (COUNT_MAX - COUNT_MIN) * 100;
  e.target.style.setProperty("--p", pct + "%");
  document.querySelectorAll(".cs-val").forEach(el => el.textContent = n);
  if (n !== S.settings.count) { S.settings.count = n; saveSettings(); sfx.tap(); }
});
document.addEventListener("change", e => { if (e.target.classList.contains("cnt-range")) render(); });
document.addEventListener("submit", e => {
  if (e.target.id !== "authform") return;
  e.preventDefault();
  const name = $("#nm").value.trim() || "Oyuncu", em = $("#em");
  const via = S.sheet.via;
  S.user = { name, email: em ? em.value.trim() : (S.user && S.user.email) || "", via: via === "Misafir" ? null : via };
  store.set("user", S.user);
  if (S.sheet.edit) { S.sheet = null; render(); } else go("home");
});
document.addEventListener("keydown", e => {
  if (S.sheet && e.key === "Escape") { A.close(); return; }
  if (S.screen === "result" && e.key === "Enter" && !S.sheet && !e.target.closest("button")) { nextRound(); return; }
  if (S.screen === "setup" && e.key === "Enter" && !S.sheet && !e.target.closest("button")) { A.start(); return; }
  if (S.screen !== "game" || !G || S.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "p" || k === "P" || (k === "Escape" && G.paused)) { A.pause(); return; }
  if (G.paused || G.over) return;
  if (/^[1-9]$/.test(k)) { const t = liveTiles()[Number(k) - 1]; if (t) pickTile(t.id); }
  else if (k === "+") pickOp("+");
  else if (k === "-") pickOp("-");
  else if (k === "*" || k === "x" || k === "X") pickOp("*");
  else if (k === "/") { e.preventDefault(); pickOp("/"); }
  else if (k === "Backspace") { e.preventDefault(); undo(); }
  else if (k === "r" || k === "R") resetBoard();
  else if (k === "h" || k === "H") useHint();
  else if (k === "Enter") { e.preventDefault(); A.finish(); }
  else if (k === "Escape") { G.sel = null; G.op = null; renderGame(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.over && S.screen === "game" && !G.paused) { G.paused = true; render(); } });

matchMedia(DESK).addEventListener("change", () => render());
/* ================= boot ================= */
applyTheme(); syncMusic();
S.screen = S.user ? "home" : "login";
render();
</script>
</body>
</html>
